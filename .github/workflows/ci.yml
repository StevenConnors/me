name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27018/journey_editor_e2e
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=critical

  authoring-e2e:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports: ["27018:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
        env:
          E2E_MONGODB_URI: mongodb://127.0.0.1:27018/journey_editor_e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: /tmp/journey-editor-playwright-results
          if-no-files-found: ignore

  ux-performance:
    name: UX performance (main vs PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory until fixtures are seeded and CI noise is calibrated; remove to make it blocking.
    continue-on-error: true
    services:
      mongodb:
        image: mongo:7
        ports: ["27018:27017"]
    env:
      MONGODB_URI: mongodb://127.0.0.1:27018/perf
      NEXT_TELEMETRY_DISABLED: 1
      ROUTES: /,/photos,/travel,/thoughts-aloud
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Baseline (base branch)
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cp scripts/perf/perf-check.mjs ../base/perf-check.mjs
          cd ../base && npm ci && npx playwright install --with-deps chromium
          # node scripts/perf/seed.mjs   # deterministic fixtures, add with the first perf PR
          npm run build && (npx next start -p 3200 -H 127.0.0.1 &) && npx wait-on -t 60000 http://127.0.0.1:3200/travel
          node perf-check.mjs --base-url http://127.0.0.1:3200 --routes "$ROUTES" --runs 5 --out "$GITHUB_WORKSPACE/.perf/baseline.json"
          pkill -f "next start" || true
      - name: Pull request
        run: |
          npm ci && npm run build && (npx next start -p 3200 -H 127.0.0.1 &) && npx wait-on -t 60000 http://127.0.0.1:3200/travel
          node scripts/perf/perf-check.mjs --base-url http://127.0.0.1:3200 --routes "$ROUTES" --runs 5 --baseline .perf/baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
