name: Post-deploy smoke

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Immutable deployment URL to check
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production' &&
       github.event.deployment.creator.login == 'vercel[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke deployment
        id: smoke
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}
          EXPECT_SHA: ${{ github.event.deployment.sha }}
        run: |
          args=(--base-url "$BASE_URL" --public-origin "https://me-indol.vercel.app")
          if [ -n "$EXPECT_SHA" ]; then args+=(--expect-sha "$EXPECT_SHA"); fi
          node scripts/smoke/production.mjs "${args[@]}"
      - name: Record result on deployed commit
        if: always() && github.event_name == 'deployment_status'
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.DEPLOY_SHA,
              state: process.env.SMOKE_RESULT === 'success' ? 'success' : 'failure',
              context: 'production/smoke',
              description: 'Production deployment smoke result',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
